<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف ألفاهاشم ودينا</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .header-title {
            font-family: 'Amiri', serif;
            color: #8b6b35;
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background: #ffffff;
        }
        .btn-gold {
            background-color: #8b6b35;
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            background-color: #6d5328;
            color: white;
        }
        .wish-card {
            border-right: 4px solid #8b6b35 !important;
            border-radius: 8px;
            background-color: #fdfbf7;
        }
        .info-box {
            background-color: #fdfbf7;
            border: 1px dashed #8b6b35;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="text-center py-5 bg-white border-bottom shadow-sm">
        <div class="container">
            <h1 class="header-title display-4 fw-bold">دعوة زفاف ألفاهاشم ودينا</h1>
            <p class="lead text-muted mt-2">مرحباً بكم في صفحة التهنئة ومشاركة الفرحة</p>
            
            <!-- Wedding Details Section -->
            <div class="col-md-8 mx-auto mt-4">
                <div class="info-box p-3 shadow-sm">
                    <p class="mb-1 fw-bold text-dark fs-5">📅 موعد الزفاف: <span class="text-secondary">14 / 8</span></p>
                    <p class="mb-0 fw-bold text-dark fs-5">📍 المكان: <span class="text-secondary">في منزلهم خلف معسكر الاحتياطي المركزي - الكلاكلة</span></p>
                </div>
            </div>
        </div>
    </header>

    <div class="container my-5">
        <div class="row g-4">
            <!-- Form Section -->
            <div class="col-md-5">
                <div class="card card-custom p-4">
                    <h3 class="h5 fw-bold mb-3 text-secondary">أرسل تهنئتك للعروسين</h3>
                    <form id="wish-form">
                        <div class="mb-3">
                            <label for="wish-name" class="form-label">الاسم</label>
                            <input type="text" class="form-control" id="wish-name" placeholder="اكتب اسمك هنا" required>
                        </div>
                        <div class="mb-3">
                            <label for="wish-message" class="form-label">التهنئة</label>
                            <textarea class="form-control" id="wish-message" rows="4" placeholder="اكتب تهنئتك للعروسين..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-gold w-100 py-2 fw-bold">إرسال التهنئة</button>
                    </form>
                </div>
            </div>

            <!-- Wishes List Section -->
            <div class="col-md-7">
                <div class="card card-custom p-4">
                    <h3 class="h5 fw-bold mb-3 text-secondary">سجل التهاني</h3>
                    <div id="wishes-container">
                        <div class="text-center text-muted py-4">
                            <div class="spinner-border spinner-border-sm text-secondary me-2" role="status"></div>
                            جاري جلب التهاني...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase CDN SDKs (v8 Compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
      // إعدادات Firebase الخاصة بمشروعك
      const firebaseConfig = {
        apiKey: "AIzaSyDLo0o7DrvOn9DlgbLRf_8jqs-Jo1IPOkU",
        authDomain: "mosab-amna-wedding.firebaseapp.com",
        databaseURL: "https://mosab-amna-wedding-default-rtdb.firebaseio.com",
        projectId: "mosab-amna-wedding",
        storageBucket: "mosab-amna-wedding.firebasestorage.app",
        messagingSenderId: "579615543308",
        appId: "1:579615543308:web:3a975c4c9c986407b09e29",
        measurementId: "G-XDEHJDJXHR"
      };

      // تهيئة الاتصال بقاعدة البيانات
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();

      // 1. دالة جلب التهاني لعرضها تلقائياً
      function loadWishes() {
        const container = document.getElementById('wishes-container');
        if (!container) return;

        db.ref('wishes').on('value', (snapshot) => {
          container.innerHTML = ''; // إزالة عبارة التحميل

          if (snapshot.exists()) {
            const data = snapshot.val();
            // عرض التهاني مرتبة من الأحدث إلى الأقدم
            Object.values(data).reverse().forEach(wish => {
              container.innerHTML += `
                <div class="wish-card p-3 my-2 border rounded shadow-sm">
                  <strong class="d-block text-dark fw-bold">${escapeHtml(wish.name)}</strong>
                  <p class="mb-0 text-secondary mt-1">${escapeHtml(wish.message)}</p>
                </div>
              `;
            });
          } else {
            container.innerHTML = '<p class="text-center text-muted py-3">لا توجد تهاني حتى الآن، كن أول من يهنئ العروسين!</p>';
          }
        }, (error) => {
          console.error("Firebase Read Error:", error);
          container.innerHTML = '<p class="text-center text-danger py-3">حدث خطأ أثناء تحميل التهاني، تأكد من إعدادات القواعد (Rules) في Firebase.</p>';
        });
      }

      // 2. دالة حماية من الثغرات (XSS Prevention)
      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
      }

      // 3. دالة إرسال التهنئة وحفظها في Firebase
      function submitWish(event) {
        event.preventDefault();

        const nameInput = document.getElementById('wish-name');
        const msgInput = document.getElementById('wish-message');

        const name = nameInput.value.trim();
        const message = msgInput.value.trim();

        if (!name || !message) {
          alert('يرجى كتابة الاسم ونص التهنئة أولاً');
          return;
        }

        db.ref('wishes').push({
          name: name,
          message: message,
          timestamp: Date.now()
        }).then(() => {
          nameInput.value = '';
          msgInput.value = '';
          alert('تم إرسال تهنئتك بنجاح!');
        }).catch((err) => {
          console.error("Firebase Write Error:", err);
          alert('حدث خطأ أثناء إرسال التهنئة، حاول مرة أخرى.');
        });
      }

      // تشغيل الكود فور استكمال تحميل العناصر
      document.addEventListener('DOMContentLoaded', () => {
        loadWishes();
        const wishForm = document.getElementById('wish-form');
        if (wishForm) {
          wishForm.addEventListener('submit', submitWish);
        }
      });
    </script>
</body>
</html>
